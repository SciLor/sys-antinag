name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release on a tag

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0          # full history + tags, so `git describe` can name the version

      - name: Tools
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update && apt-get install -y --no-install-recommends zip build-essential
          # the image's libnx can be older than libnx 4.12, which libstratosphere-free sysmodule + overlay still want
          # pkg.devkitpro.org answers 403 now and then; retry instead of failing the build
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "attempt $i failed, retrying"; sleep $((i * 20)); done; return 1; }
          retry dkp-pacman -Syu --noconfirm
          retry dkp-pacman -S --noconfirm --needed libnx switch-curl switch-zlib switch-mbedtls

      - name: Unit tests (patch logic, with sanitizers)
        run: make test

      - name: Build sysmodule + overlay
        run: make dist

      - name: Version
        id: version
        run: echo "name=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: sys-antinag-${{ steps.version.outputs.name }}
          path: sys-antinag.zip

      - name: Release notes from CHANGELOG.md (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See CHANGELOG.md" > release-notes.md

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sys-antinag.zip
          body_path: release-notes.md
